[project]
name = "Textify"
version = "0.1.0"
description = "Create transcription for media content"
readme = "README.md"
authors = [
    { name = "ThinhLe881", email = "thinhleminh201@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite==0.22.1",
    "alembic==1.20.0",
    "av==18.1.0",
    "ctranslate2==4.8.2",
    "fastapi[standard]==0.141.1",
    "faster-whisper==1.2.1",
    "langcodes==3.5.1",
    "pydantic-settings==2.15.0",
    "requests==2.34.2",
    "sqlalchemy==2.0.54",
    "youtube-transcript-api==1.2.4",
    "yt-dlp==2026.7.4",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.6",
]

[project.scripts]
textify = "textify.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: exercises explicitly configured public videos against a running Textify API",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["ctranslate2", "faster_whisper", "yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
